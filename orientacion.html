<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPA Flow · Orientación del sistema</title>
<style>
:root{--bg:#08020f;--panel:#160a22;--line:#633178;--text:#e9e1ee;--muted:#aa9bb2;--pink:#e42bff;--violet:#c476ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 10%,#35104c 0,transparent 38%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{width:min(1080px,calc(100% - 32px));margin:24px auto;min-height:calc(100vh - 48px);display:grid;grid-template-columns:240px 1fr;border:1px solid #32173f;border-radius:24px;overflow:hidden;background:rgba(10,3,17,.85)}aside{padding:30px 24px;border-right:1px solid #32173f}main{padding:46px clamp(24px,5vw,64px)}.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--violet)}.brand b{display:block;font-size:28px;letter-spacing:.08em;color:#fff;margin-top:12px}.progress{margin-top:48px}.progress small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.bar{height:4px;background:#30193b;border-radius:4px;margin-top:12px}.fill{height:100%;width:25%;background:var(--pink);transition:.3s}.steps{display:grid;gap:18px;margin-top:28px}.step{display:flex;gap:10px;align-items:center;color:#6f6079;font-size:13px}.step i{width:24px;height:24px;border:1px solid #563065;border-radius:50%;display:grid;place-items:center;font-style:normal}.step.active{color:#fff}.step.active i{background:var(--pink);border-color:var(--pink)}h1{font:500 clamp(42px,7vw,78px)/.95 Georgia,serif;margin:22px 0 20px}h1 em{color:var(--violet)}.lead{max-width:620px;color:var(--muted);font-size:17px;line-height:1.7}.screen{margin-top:34px;border:1px solid var(--line);border-radius:20px;padding:26px;background:rgba(24,10,34,.7)}h2{font:500 32px Georgia,serif;margin:0 0 10px}.hint{color:var(--muted);line-height:1.6}.options{display:grid;gap:11px;margin-top:22px}.option{border:1px solid #4a255b;background:#12081b;color:var(--text);border-radius:13px;padding:16px;text-align:left;cursor:pointer;font-size:15px;transition:.2s}.option:hover{border-color:var(--pink);transform:translateX(3px)}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.result-box{border:1px solid #4a255b;padding:16px;border-radius:13px}.result-box strong{display:block;color:var(--violet);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.result-box p{margin:0;line-height:1.55;color:var(--text)}.cta{display:inline-block;margin-top:24px;padding:13px 22px;border-radius:24px;background:var(--pink);color:#fff;text-decoration:none;font-weight:bold}.back{color:var(--muted);text-decoration:none;font-size:13px}@media(max-width:720px){.app{display:block;margin:0;width:100%;min-height:100vh;border:0;border-radius:0}aside{border-right:0;border-bottom:1px solid #32173f;padding:22px}.progress{margin-top:22px}.steps{grid-template-columns:repeat(4,1fr);gap:6px}.step{display:grid;justify-items:center;text-align:center;font-size:10px}.step i{width:22px;height:22px}main{padding:30px 20px}.result-grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><a class="back" href="index.html#servicios">← Volver a MPA Flow</a><div class="brand" style="margin-top:34px">MPA Flow<b>ORIENTACIÓN</b></div><div class="progress"><small id="progressLabel">Paso 1 de 4</small><div class="bar"><div class="fill" id="fill"></div></div></div><div class="steps"><div class="step active"><i>1</i><span>Momento</span></div><div class="step"><i>2</i><span>Tendencia</span></div><div class="step"><i>3</i><span>Objetivo</span></div><div class="step"><i>4</i><span>Mapa</span></div></div></aside><main id="appMain"><div class="brand">Una primera lectura del sistema</div><h1>¿Qué necesita hoy<br><em>tu organización?</em></h1><p class="lead">Respondé tres preguntas para reconocer el momento actual, la tendencia que aparece y el próximo paso que puede generar más correspondencia.</p><div class="screen" id="screen"></div></main></div><script>
const data=[{title:'¿En qué momento está hoy tu organización?',hint:'Elegí la situación que más se parece a la que están atravesando.',options:[['growth','Estamos creciendo y queremos sostener el próximo nivel.'],['automation','Queremos automatizar y necesitamos definir por dónde empezar.'],['dependency','La operación funciona, pero depende demasiado de personas clave.'],['technology','Estamos incorporando tecnología y queremos que encuentre su lugar.'],['alignment','Tenemos muchas iniciativas y necesitamos conectar prioridades.'],['adoption','El cambio ya comenzó y queremos que pueda sostenerse.']]},{title:'Cuando aumenta la complejidad, ¿qué aparece primero?',hint:'Esto ayuda a reconocer la tendencia del sistema.',options:[['growth','La operación se sobrecarga y los acuerdos informales ya no alcanzan.'],['automation','Se agregan herramientas antes de comprender el flujo completo.'],['dependency','Las decisiones importantes esperan a una persona.'],['technology','La herramienta no refleja todavía cómo se trabaja realmente.'],['alignment','Los equipos trabajan mucho, pero en direcciones diferentes.'],['adoption','La solución existe, pero todavía no forma parte del trabajo cotidiano.']]},{title:'¿Qué te gustaría hacer posible?',hint:'Elegí el objetivo que más valor tendría ahora.',options:[['growth','Crecer con una operación clara y sostenible.'],['automation','Reducir tiempos, repeticiones y retrabajo.'],['dependency','Distribuir conocimiento, ownership y capacidad de decisión.'],['technology','Integrar tecnología, procesos y personas.'],['alignment','Tomar decisiones con una visión compartida.'],['adoption','Lograr autonomía y evolución después de la implementación.']]}];let step=0,answers=[];const screen=document.getElementById('screen'),fill=document.getElementById('fill'),label=document.getElementById('progressLabel'),steps=[...document.querySelectorAll('.step')];function render(){if(step===3)return renderResult();let q=data[step];label.textContent=`Paso ${step+1} de 4`;fill.style.width=`${(step+1)*25}%`;steps.forEach((s,i)=>s.classList.toggle('active',i===step));screen.innerHTML=`<h2>${q.title}</h2><p class="hint">${q.hint}</p><div class="options">${q.options.map(o=>`<button class="option" data-key="${o[0]}">${o[1]}</button>`).join('')}</div>`;screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers.push({key:b.dataset.key,text:b.textContent});step++;render()})}function renderResult(){const key=answers[2]?.key||answers[0]?.key||'growth';const names={growth:'Capacidad para crecer',automation:'Automatización con correspondencia',dependency:'Autonomía distribuida',technology:'Tecnología integrada al sistema',alignment:'Dirección compartida',adoption:'Evolución sostenible'};const next={growth:'Mapear un flujo prioritario y diseñar la arquitectura operativa que sostenga el próximo nivel.',automation:'Medir repeticiones, esperas y retrabajo antes de elegir una automatización.',dependency:'Diseñar ownership, documentación, transferencia y capacidades internas.',technology:'Modelar el flujo real y configurar la tecnología para acompañarlo.',alignment:'Construir una vista común de prioridades, decisiones, información y dependencias.',adoption:'Planificar habilitación, capacitación, soporte y evolución.'};label.textContent='Mapa de orientación';fill.style.width='100%';steps.forEach((s,i)=>s.classList.toggle('active',i===3));screen.innerHTML=`<h2>Tu sistema está pidiendo <em>${names[key]}</em></h2><p class="hint">Esta es una primera orientación, no un diagnóstico cerrado. Te ayuda a decidir qué conviene mirar antes de intervenir.</p><div class="result-grid"><div class="result-box"><strong>Situación actual</strong><p>${answers[0]?.text||''}</p></div><div class="result-box"><strong>Tendencia</strong><p>${answers[1]?.text||''}</p></div><div class="result-box"><strong>Objetivo</strong><p>${answers[2]?.text||''}</p></div><div class="result-box"><strong>Próximo paso</strong><p>${next[key]}</p></div></div><a class="cta" href="index.html#contacto">Conversar sobre este escenario →</a>`}render();
</script></body></html>
